spring.application.name=aifundraiser

server.port=8081
#LOCAL DB CONNECTION
spring.datasource.url=jdbc:mysql://localhost:3306/ngo_ai
spring.datasource.jdbcUrl=${spring.datasource.url}
spring.datasource.username=root
spring.datasource.password=root

#SERP CONFIGURATION
serp.api.key=
serp.base.url=https://serpapi.com/search

#OPEN WEATHER CONFIGURATION
open.weather.api.key=
open.weather.base.url=https://api.openweathermap.org/data/2.5/weather
open.weather.forecast.url=https://api.openweathermap.org/data/2.5/forecast

#GDELT NEWS PROPERTIES
gdelt.base.url=https://api.gdeltproject.org/api/v2/doc/doc
googlenews.base.url=https://news.google.com/rss/search


#WORLD BANK API PROPERTIES
world.bank.base.url=https://api.worldbank.org/v2/country

#USGS EARTHQUAKE API PROPERTIES
usgs.earthquake.base.url=https://earthquake.usgs.gov/fdsnws/event/1/query

#NASA EONET API PROPERTIES
nasa.eonet.base.url=https://eonet.gsfc.nasa.gov/api/v3/events

#WHO API PROPERTIES
who.base.url=https://ghoapi.azureedge.net/api

#LOCATIONIQ API PROPERTIES
location.base.url=https://nominatim.openstreetmap.org

# Campaign Opportunity Scoring Weights
scoring.weights.SEARCH_INTEREST=0.25
scoring.weights.NEWS_MENTIONS=0.20
scoring.weights.DISASTER_COUNT=0.20
scoring.weights.DONATION_HISTORY=0.15
scoring.weights.WEATHER_RISK=0.10
scoring.weights.POVERTY_RATE=0.05
scoring.weights.HEALTH_SCORE=0.05

# Gemini Configuration

gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=
gemini.model=gemini-flash-latest
